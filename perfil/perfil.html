<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login e Cadastro</title>
    <link rel="stylesheet" href="criar.css">
</head>
<body>
    <h2>Fazer Login</h2>
    <form action="/login" method="POST">
        <label for="log-email">E-mail:</label>
        <input type="email" id="log-email" name="email" required><br><br>
        
        <label for="log-senha">Senha:</label>
        <input type="password" id="log-senha" name="senha" required><br><br>
        
        <button type="submit">Entrar</button>
    </form>
    <a href="registrar/regi.html"></a>

</body>
</html>
